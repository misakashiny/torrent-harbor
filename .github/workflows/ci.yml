name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/work" -w /work node:24-alpine sh -c 'npm ci --include=dev --no-audit --no-fund && npm run check'
      - run: python3 -m unittest discover -s tests -p '*_test.py'
